                                <span>GŁÓD</span>
                                <div class="game-progress-bar"><div id="hunger-bar" class="game-progress"></div></div>
                            </div>
                            <div class="game-stat-row">
                                <span>CZYSTOŚĆ</span>
                                <div class="game-progress-bar"><div id="clean-bar" class="game-progress"></div></div>
                            </div>
                            <div class="game-stat-row">
                                <span>SEN</span>
                                <div class="game-progress-bar"><div id="sleep-bar" class="game-progress"></div></div>
                            </div>
                        </div>
                        <!--półka na przedmioty-->
                        <div class="item-shelf">
                            <div class="inventory-item" id="item-food">
                                <img src="cukierek.png" class="item-graphic-img">
                            </div>
                            <div class="inventory-item" id="item-sponge">
                                <img src="gabka.png" class="item-graphic-img">
